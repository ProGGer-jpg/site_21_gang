{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему | 21-GAME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --cyber-green: #10b981; /* Мягкий изумрудный */
            --cyber-green-hover: #059669;
            --cyber-blue: #38bdf8;  /* Спокойный голубой */
            --bg-dark: #0f172a;     /* Чуть более мягкий темный фон */
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        .bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            object-fit: cover;
        }

        /* Чуть более плотная пелена, чтобы контраст текста был мягче */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: -1;
        }

        .cyber-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            /* Убрали жесткие тени, оставили мягкий объем */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 2.5rem;
            color: #d1d5db;
            width: 100%;
            max-width: 400px;
        }

        .cyber-logo {
            font-weight: 900;
            font-size: 2rem;
            color: #ffffff;
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }
        .cyber-logo span {
            color: var(--cyber-green);
        }

        .cyber-card label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .cyber-card input[type="text"],
        .cyber-card input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .cyber-card input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--cyber-blue);
            /* Мягкое голубое свечение при вводе */
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .cyber-btn {
            background-color: var(--cyber-green);
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            padding: 14px;
            border-radius: 6px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background-color: var(--cyber-green-hover);
            transform: translateY(-1px);
            /* Легкая зеленая тень вместо кислотного взрыва */
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .cyber-alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

<video autoplay loop muted playsinline class="bg-video">
    <source src="{% static 'samurai.mp4' %}" type="video/mp4">
</video>
<div class="video-overlay"></div>

<div class="container d-flex justify-content-center">
    <div class="cyber-card">
        <div class="cyber-logo">21<span>-GAME</span></div>

        {% if messages %}
            {% for message in messages %}
                <div class="cyber-alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div>
                <label>Логин</label>
                {{ form.username }}
            </div>

            <div>
                <label>Пароль</label>
                {{ form.password }}
            </div>

            <button type="submit" class="cyber-btn mt-2">Войти</button>
        </form>
    </div>
</div>

</body>
</html>
