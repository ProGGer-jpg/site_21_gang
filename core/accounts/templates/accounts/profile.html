<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h4>Мой профиль</h4>
                </div>
                <div class="card-body">
                    <p><strong>Имя:</strong> {{ profile.user.get_full_name }}</p>
                    <p><strong>Логин:</strong> {{ profile.user.username }}</p>
                    <p><strong>Email:</strong> {{ profile.user.email }}</p>
                    <p><strong>Роль:</strong> {{ profile.get_role_display }}</p>
                    <p><strong>Телефон:</strong> {{ profile.phone|default:"Не указан" }}</p>
                    <!-- Кнопка только для админов -->
                    {% if user.is_staff %}
                    <a href="{% url 'register_employee' %}" class="btn btn-success w-100 mt-3">
                        ➕ Зарегистрировать нового сотрудника
                    </a>
                    {% endif %}
                    <a href="{% url 'quick_booking' %}" class="btn btn-primary w-100 mt-2">На главную</a>
                    <a href="{% url 'logout' %}" class="btn btn-danger w-100 mt-2">Выйти</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
