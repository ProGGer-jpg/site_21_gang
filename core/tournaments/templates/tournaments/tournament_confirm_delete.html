{% extends "bookings/base.html" %}
{% block title %}Удаление турнира{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Удаление турнира</h1>

    <div class="alert alert-warning mt-4">
        <p>Вы уверены, что хотите удалить турнир <strong>"{{ tournament.title }}"</strong>?</p>
        <p>Это действие нельзя отменить.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'tournaments:tournament_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
