<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Игровые комнаты{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand mb-0 h1 text-decoration-none" href="/">🎮 Система бронирования</a>
        <div class="d-flex align-items-center">
            <a href="/" class="btn btn-outline-primary btn-sm me-2">Бронирование</a>
            <a href="{% url 'games_catalog' %}" class="btn btn-outline-success me-2">📚 Игры</a>
            <a href="{% url 'rooms_catalog' %}" class="btn btn-outline-info me-2">🏢 Комнаты</a>
            <a href="{% url 'game_requests:request_list' %}" class="btn btn-outline-primary btn-sm me-2">Заявки на игры</a>
            <a href="{% url 'tournaments:tournament_list' %}" class="btn btn-outline-primary btn-sm me-3">🏆 Турниры</a>
            <span class="text-muted me-2">Привет,</span>
            <a href="{% url 'profile' %}" class="btn btn-outline-primary">
                <strong>{{ user.get_full_name|default:user.username }}</strong>
            </a>
            <a href="{% url 'logout' %}" class="btn btn-outline-danger ms-2 btn-sm">
                Выйти
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
