<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}21-GAME | Киберспорт{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --bg-nav: rgba(10, 11, 14, 0.95);
            --text-main: #d1d5db;
            --acid-green: #39ff14;
            --neon-blue: #00f0ff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* Шапка */
        .cyber-header {
            background-color: var(--bg-nav);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 0;
            backdrop-filter: blur(10px);
        }

        /* Логотип */
        .cyber-logo {
            font-weight: 900;
            font-size: 1.6rem;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .cyber-logo span {
            color: var(--acid-green);
        }

        /* Навигация */
        .nav-link.cyber-link {
            color: var(--text-main);
            text-transform: uppercase;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin: 0 12px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        .nav-link.cyber-link:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* Кнопка бронирования */
        .cyber-btn {
            background-color: var(--acid-green);
            color: #000000;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border: none;
            padding: 10px 28px;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
        }
        .cyber-btn:hover {
            background-color: #32e011;
            color: #000000;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            transform: translateY(-2px);
        }

        /* Блок профиля */
        .user-block {
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        .user-block a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.2s;
        }
        .user-block a:hover {
            color: var(--neon-blue);
        }
        .logout-link {
            color: #6b7280 !important;
        }
        .logout-link:hover {
            color: #ff4444 !important;
            text-shadow: 0 0 8px rgba(255, 68, 68, 0.4);
        }
    </style>
</head>
<body>

<style>
    /* Стили для ссылок навигации */
    .cyber-nav-link {
        color: #94a3b8;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 20px; /* Скругление как на твоем скрине */
        transition: all 0.3s ease; /* Плавная анимация */
    }

    /* Эффект при наведении (hover) */
    .cyber-nav-link:hover {
        color: #ffffff; /* Текст становится белым */
        background: rgba(255, 255, 255, 0.1); /* Появляется полупрозрачный фон */
    }
</style>

<header class="cyber-header sticky-top" style="background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 15px 0;">
    <div class="container-fluid px-4 px-lg-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between">

            <a href="/" class="text-decoration-none" style="font-weight: 900; font-size: 1.5rem; letter-spacing: 1px; color: #ffffff;">
                21<span style="color: #10b981;">-GAME</span>
            </a>

            <nav class="d-none d-lg-flex gap-2">
                <a href="{% url 'games_catalog' %}" class="cyber-nav-link">Игры</a>
                <a href="{% url 'rooms_catalog' %}" class="cyber-nav-link">Комнаты</a>
                <a href="{% url 'game_requests:request_list' %}" class="cyber-nav-link">Заявки</a>
                <a href="{% url 'tournaments:tournament_list' %}" class="cyber-nav-link">Турниры</a>
                <a href="{% url 'tournaments:rating_list' %}" class="cyber-nav-link">Рейтинг</a>
            </nav>

            <div class="d-flex align-items-center gap-4">
                <div class="text-end">
                    <a href="{% url 'profile' %}" class="text-decoration-none fw-bold text-white d-block" style="font-size: 0.85rem;">{{ user.username }}</a>
                    <a href="{% url 'logout' %}" class="text-decoration-none text-secondary" style="font-size: 0.75rem; transition: color 0.3s;" onmouseover="this.style.color='#ff4444'" onmouseout="this.style.color='#6c757d'">Выйти</a>
                </div>
                <a href="/" class="btn btn-success px-4 py-2 fw-bold" style="background: #10b981; border: none; border-radius: 6px; font-size: 0.85rem; text-transform: uppercase; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">Забронировать</a>
            </div>

        </div>
    </div>
</header>

<div class="container mt-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} bg-dark text-white border-{{ message.tags }} alert-dismissible fade show shadow" style="border-left: 4px solid var(--acid-green);">
                {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
